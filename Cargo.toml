[package]
name = "RustOS"
version = "0.1.1"
edition = "2021"
description = "Build/run harness for the rust_os kernel"

[build-dependencies]
bootloader = { version = "=0.11.10", default-features = false, features = ["bios"] }
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace]
resolver = "2"
members = ["kernel"]
default-members = ["."]
