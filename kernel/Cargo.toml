[package]
name = "kernel"
version = "0.1.1"
edition = "2021"
description = "rust_os kernel"

[dependencies]
bootloader_api = "=0.11.17"
x86_64 = { version = "=0.15.5", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
spin = "0.9.9"
pic8259 = "0.11.0"
pc-keyboard = "0.8.0"
linked_list_allocator = "0.10"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-icmp"] }
